<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FreshMarket - Customer Profile</title>
</head>
<body>

    <h1>Customer Profile</h1>
    <p>Welcome to your personal account area.</p>

    <hr>

    <h2>Personal Information</h2>
    <form action="customer.html" method="get">
        <p>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="user" required>
        </p>

        <p>
            <label for="password">Current Password:</label>
            <input type="password" id="password" name="password" value="123456" required>
        </p>

        <p>
            <input type="submit" value="Update Profile">
        </p>
    </form>

    <hr>

    <h2>Account Options</h2>
    <ul>
        <li><a href="logout.html">Log out</a></li>
        <li><a href="index.html">Return to Homepage</a></li>
    </ul>

</body>
</html>
